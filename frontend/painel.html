<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#022E2D">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/area.css">
    <title>Painel - BioHub</title>
</head>
<body>
    <div class="topbar">
        <span class="status-dot" aria-hidden="true"></span>
        <strong>BioHub</strong>
        <span class="topbar-description">Liga Acadêmica de Biotecnologia</span>
    </div>

    <header class="site-header">
        <a class="brand" href="painel.html" aria-label="BioHub">
            <img src="img/logo-login.png" alt="" class="brand-logo">
            <span class="brand-name">BioHub</span>
        </a>
        <div class="header-user">
            <span class="quem" id="quem" hidden></span>
            <button type="button" class="btn btn-sec btn-pequeno" id="btn-sair" hidden>Sair</button>
        </div>
    </header>

    <main class="area-page">
        <section class="area-card" id="cartao-ola" hidden>
            <h1 id="ola"></h1>
            <p class="area-sub" id="detalhes"></p>
            <a class="btn" id="link-admin" href="admin.html" hidden>Gerenciar membros</a>
        </section>

        <section class="area-card" id="cartao-carregando">
            <p class="area-sub">Verificando seu acesso...</p>
        </section>

        <section class="area-card" id="cartao-aviso" hidden>
            <h2>Espaço dos membros</h2>
            <p class="area-sub">Aqui vão ficar as publicações da liga: publicar, editar e excluir posts. Em construção.</p>
        </section>
    </main>

    <script type="module" src="js/painel.js"></script>
</body>
</html>
